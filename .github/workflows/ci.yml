name: CI

on:
  # Feature branches are checked by their pull request, main after the merge.
  push:
    branches: [main]
  pull_request:

# A new push to the same pull request cancels the outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, Kirby ${{ matrix.kirby }}, ${{ matrix.deps }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        kirby: ['5']
        # lowest: the oldest Kirby and the oldest dependencies allowed by composer.json.
        # locked: the versions in composer.lock (Kirby 5), the ones the plugin is developed against.
        # newest: the newest versions allowed by composer.json.
        deps: [lowest, locked]
        # Kirby 6 needs PHP 8.3 or newer. composer.lock stays on Kirby 5.
        include:
          - { php: '8.3', kirby: '6', deps: lowest }
          - { php: '8.4', kirby: '6', deps: newest }
          - { php: '8.5', kirby: '6', deps: newest }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring
          coverage: none

      # platform.php resolves the dependencies for PHP 8.2, which Kirby 6 no
      # longer supports. The constraint is narrowed only inside the job.
      - name: Pin Kirby 6
        if: matrix.kirby == '6'
        run: |
          composer config --unset platform.php
          composer require --dev 'getkirby/cms:^6.0' --no-update --no-interaction

      - name: Install dependencies, lowest versions
        if: matrix.deps == 'lowest'
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-lowest --prefer-stable

      - name: Install dependencies, newest versions
        if: matrix.deps == 'newest'
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-stable

      - name: Install dependencies, locked versions
        if: matrix.deps == 'locked'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Kirby version
        run: composer show getkirby/cms | grep versions

      - name: Tests (Kirby as fixture)
        run: vendor/bin/phpunit

  analysis:
    name: Analysis, PHP 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PHP Mess Detector 2.x prints deprecation lines on PHP 8.5 and would
      # mix them into its report, so this job stays on 8.4.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Composer validate
        run: composer validate --strict --no-check-version --no-check-all

      - name: Composer normalize
        run: composer normalize:check

      - name: Undeclared dependencies
        run: composer analyze:require-checker

      - name: Unused dependencies
        run: composer analyze:unused

      # phpcpd 6 needs sebastian/cli-parser 1.x, which PHPUnit 11 excludes, so
      # it is installed globally and not as a dependency.
      - name: Install phpcpd
        run: |
          composer global require --no-interaction sebastian/phpcpd:6.0.3
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"

      - name: Copy-paste detection
        run: phpcpd --fuzzy --exclude tests --exclude vendor .

      - name: Platform requirements
        run: composer check-platform-reqs

      - name: Psalm
        run: composer analyze:psalm

      - name: PHP Mess Detector
        run: composer analyze:phpmd

  style:
    name: Code style, PHP 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # getkirby/php-cs needs PHP 8.3 or newer, so it is installed globally and
      # not as a dependency: the package itself supports PHP 8.2.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install php-cs
        run: |
          composer global require --no-interaction getkirby/php-cs:0.2.1
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"

      - name: Check code style
        run: kirby-cs fix --dry-run --diff
